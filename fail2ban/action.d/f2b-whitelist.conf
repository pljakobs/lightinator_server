[Definition]
# Add the knocked IP to the sshd jail's ignore list, granting SSH access for
# the bantime window (default: 600s / 10 minutes).
actionstart =
actionstop  =
actioncheck =

actionban   = /usr/bin/python3 -c \
    'from fail2ban.client.fail2banclient import exec_command_line; \
     exec_command_line(["fail2ban-client", "set", "sshd", "addignoreip", "<ip>"])' && \
    /usr/bin/python3 -c \
    'from fail2ban.client.fail2banclient import exec_command_line; \
     exec_command_line(["fail2ban-client", "set", "sshd", "unbanip", "<ip>"])'

actionunban = /usr/bin/python3 -c \
    'from fail2ban.client.fail2banclient import exec_command_line; \
     exec_command_line(["fail2ban-client", "set", "sshd", "delignoreip", "<ip>"])'

[Init]
# name=default
