[Definition]
# Target: Nginx access log (combined format)
# Matches: 404/403/401 responses for sensitive paths (git, env, admin, wp, php, etc.)
failregex = ^<HOST> -.*GET .*(?:\.git|\.env|admin|setup|config|php).* HTTP/.* (?:404|403|401)
            ^<HOST> -.*GET /wp-.* HTTP/.* 404

# Don't ban on the deploy-knock path (handled by gh-knocker jail)
ignoreregex = ^<HOST> -.*"GET /deploy-knock-a8b252a9fe6313c2f9cf34d88fb93ce74af12e98a33bf3627e43c0e6b3e526b2 HTTP.*" 404

[Init]
datepattern = ^\[%%d/%%b/%%Y:%%H:%%M:%%S %%z\]
