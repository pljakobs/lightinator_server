[Definition]
# Matches the secret knock URL.
# The literal hash is NOT stored here — this template file is deployed by
# deploy/setup.sh which substitutes DEPLOY_KNOCK_HASH from the environment
# (set from the DEPLOY_KNOCK_HASH server secret) to produce the live file at
# /etc/fail2ban/filter.d/gh-knocker.conf on the server.
#
# To generate a suitable hash:
#   openssl rand -hex 32
#
failregex = ^<HOST> -.*"GET /deploy-knock-a8b252a9fe6313c2f9cf34d88fb93ce74af12e98a33bf3627e43c0e6b3e526b2 HTTP.*" (200|404)
ignoreregex =
