# Custom fail2ban jail configuration for lightinator.de
# Deploy to /etc/fail2ban/jail.d/lightinator.conf (or append to jail.conf)

[gh-knocker]
enabled   = true
filter    = gh-knocker
logpath   = /var/log/nginx/access.log
maxretry  = 1
# SSH access window: 10 minutes
bantime   = 600
action    = f2b-whitelist

[nginx-podlet-access]
enabled   = true
filter    = nginx-podlet-access
logpath   = /var/log/nginx/access.log
maxretry  = 3
bantime   = 86400

[recidive]
logpath   = /var/log/fail2ban.log
banaction = %(banaction_allports)s
bantime   = 1w
findtime  = 1d
