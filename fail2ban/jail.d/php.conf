[http-exploit-scanner]
enabled = true
port = http,https
filter = http-exploit-scanner
logpath = /var/log/nginx/access.log
# Adjust logpath depending on your web server (e.g., /var/log/apache2/access.log)
maxretry = 3
findtime = 60
bantime = 86400
# 86400 seconds = 24 hours (or use -1 for permanent ban)

