[nginx-podlet-access]
enabled = true
port    = http,https
filter  = nginx-podlet-access
logpath = /var/log/nginx/access.log
# Look back 1 hour, ban for 24 hours
findtime = 1h
maxretry = 3
bantime  = 24h
datepattern = ^\[%%d/%%b/%%Y:%%H:%%M:%%S %%z\]

# Use the established RHEL-native backend
banaction = firewallcmd-ipset
banaction_allports = firewallcmd-ipset
