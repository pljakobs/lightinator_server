[recidive]
enabled = true
logpath  = /var/log/fail2ban.log
filter   = recidive

# The Strategy:
# If an IP is banned 5 times (maxretry) 
# within the last 24 hours (findtime),
# ban them for an entire week (bantime).

bantime  = 1w
findtime = 1d
maxretry = 5

# Ensure it uses the high-performance backend
banaction = firewallcmd-ipset
banaction_allports = firewallcmd-ipset
