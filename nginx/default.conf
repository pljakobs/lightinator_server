
server {
    listen      80;
    listen      443 ssl;
    listen  [::]:443 ssl;
    server_name  lightinator.de;

    ssl_certificate     /etc/letsencrypt/live/lightinator.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lightinator.de/privkey.pem;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "OPTIONS, GET, HEAD";
        add_header Cache-Control "no-store, no-cache";

        if ($request_method = OPTIONS) {
            add_header Content-Type text/plain;
            add_header Content-Length 0;
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "OPTIONS, GET, HEAD";
            add_header Access-Control-Allow-Headers "*";
            return 204;
        }
    }

    # TODO: Add API proxy once version-api service is deployed
    # location /api/ {
    #     proxy_pass http://127.0.0.1:8765/;
    #     proxy_set_header Host $http_host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    # Redirect /public-stats/ pretty URL to the real Grafana dashboard path
    location = /public-stats/ {
        return 301 https://lightinator.de/dashboard/public-dashboards/95c273957df845b59c9113abde30dba2;
    }

    # Gatekeeper proxy for Grafana — only public routes allowed
    location /dashboard/ {
        if ($request_uri !~* "^/dashboard/(public/|public-dashboards/|api/public/|api/datasources/proxy/|api/live/)") {
            return 404;
        }

        proxy_pass http://grafana:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for websocket/live updates
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
